syntax = "proto3";

package gophkeeper.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/arsykor/gophkeeper/proto/gophkeeper/v1;gophkeeperv1";

// SecretService provides CRUD operations for secrets and binary file streaming.
// All RPCs require a JWT in the "authorization" metadata header.
service SecretService {
  // ListSecrets returns metadata for all secrets owned by the caller (no payload).
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  // GetSecret fetches the full decrypted payload of a single secret.
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);

  // CreateSecret stores a new secret.
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);

  // UpdateSecret replaces a secret's payload. Requires the current version for
  // optimistic locking — returns ABORTED on version conflict.
  rpc UpdateSecret(UpdateSecretRequest) returns (UpdateSecretResponse);

  // DeleteSecret removes a secret permanently.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);

  // UploadFile uploads a binary secret using client-side streaming.
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);

  // DownloadFile downloads a binary secret using server-side streaming.
  rpc DownloadFile(DownloadFileRequest) returns (stream DownloadFileResponse);
}

// SecretType enumerates the supported secret kinds.
enum SecretType {
  SECRET_TYPE_UNSPECIFIED = 0;
  SECRET_TYPE_CREDENTIAL = 1;
  SECRET_TYPE_TEXT = 2;
  SECRET_TYPE_BINARY = 3;
  SECRET_TYPE_CARD = 4;
}

// SecretMeta holds the metadata shown in list views.
message SecretMeta {
  string id = 1;
  string name = 2;
  SecretType type = 3;
  // metadata is a JSON-encoded map of arbitrary user-defined tags.
  string metadata = 4;
  int64 file_size = 5;
  int32 version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ListSecretsRequest {}

message ListSecretsResponse {
  repeated SecretMeta secrets = 1;
}

message GetSecretRequest {
  string id = 1;
}

message GetSecretResponse {
  SecretMeta meta = 1;
  // payload is the decrypted secret content as JSON bytes.
  bytes payload = 2;
}

message CreateSecretRequest {
  string name = 1;
  SecretType type = 2;
  string metadata = 3;
  bytes payload = 4;
}

message CreateSecretResponse {
  SecretMeta meta = 1;
}

message UpdateSecretRequest {
  string id = 1;
  string name = 2;
  string metadata = 3;
  bytes payload = 4;
  // version must match the current server version to prevent conflicts.
  int32 version = 5;
}

message UpdateSecretResponse {
  SecretMeta meta = 1;
}

message DeleteSecretRequest {
  string id = 1;
}

message DeleteSecretResponse {}

// UploadFileRequest is sent in a stream. The first message carries the header;
// subsequent messages carry raw file chunks.
message UploadFileRequest {
  oneof data {
    UploadHeader header = 1;
    bytes chunk = 2;
  }
}

message UploadHeader {
  string name = 1;
  string metadata = 3;
}

message UploadFileResponse {
  SecretMeta meta = 1;
}

message DownloadFileRequest {
  string id = 1;
}

// DownloadFileResponse is sent in a stream. The first message carries the
// header; subsequent messages carry raw file chunks.
message DownloadFileResponse {
  oneof data {
    SecretMeta meta = 1;
    bytes chunk = 2;
  }
}
